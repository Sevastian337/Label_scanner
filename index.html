<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер этикеток</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .upload-box { border: 2px dashed #4CAF50; padding: 40px 20px; text-align: center; border-radius: 10px; cursor: pointer; background: #f9fdf9; transition: 0.3s; }
        .upload-box:hover { background: #e8f5e9; }
        .upload-box p { color: #666; margin: 0; }
        #result { margin-top: 20px; padding: 20px; border-radius: 10px; display: none; }
        .verdict { font-size: 24px; font-weight: bold; margin-bottom: 10px; text-align: center; }
        .red { background: #ffebee; color: #c62828; border: 2px solid #c62828; }
        .green { background: #e8f5e9; color: #2e7d32; border: 2px solid #2e7d32; }
        .orange { background: #fff3e0; color: #e65100; border: 2px solid #e65100; }
        .found-list { list-style: none; padding: 0; }
        .found-list li { background: #f5f5f5; margin: 5px 0; padding: 10px; border-radius: 5px; border-left: 4px solid #c62828; }
        #loading { display: none; text-align: center; margin-top: 20px; font-weight: bold; color: #4CAF50; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Сканер этикеток</h1>
        <p style="text-align: center; color: #666;">Сфотографируйте состав продукта, чтобы узнать, есть ли там аллергены.</p>

        <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()">
                <p>Нажмите, чтобы сделать фото или выбрать из галереи</p>
                <input type="file" id="fileInput" name="file" accept="image/*" capture="environment" style="display: none;" onchange="this.form.submit()">
            </div>
        </form>

        <div id="loading">⏳ Распознаём текст и анализируем...</div>

        <div id="result">
            <div class="verdict" id="verdict"></div>
            <p id="calories" style="text-align: center; font-size: 18px;"></p>
            <h3>Обнаружено:</h3>
            <ul class="found-list" id="foundList"></ul>
            <details style="margin-top: 15px; font-size: 14px; color: #777;">
                <summary>Показать распознанный текст</summary>
                <p id="rawText" style="white-space: pre-wrap;"></p>
            </details>
        </div>
    </div>

    <script>
        document.getElementById('uploadForm').onsubmit = async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';

                const verdictEl = document.getElementById('verdict');
                verdictEl.textContent = data.verdict;
                verdictEl.className = 'verdict ' + data.color;

                document.getElementById('calories').textContent = data.calories ? `Калорийность: ${data.calories} ккал` : '';
                
                const list = document.getElementById('foundList');
                list.innerHTML = '';
                if (Object.keys(data.found).length === 0) {
                    list.innerHTML = '<li style="border-left-color: #4CAF50;">Ничего не найдено</li>';
                } else {
                    for (const [cat, words] of Object.entries(data.found)) {
                        list.innerHTML += `<li><strong>${cat}</strong>: ${words.join(', ')}</li>`;
                    }
                }

                document.getElementById('rawText').textContent = data.raw_text;
            } catch (err) {
                alert('Ошибка: ' + err.message);
                document.getElementById('loading').style.display = 'none';
            }
        };
    </script>
</body>
</html>
